name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify source API boundaries
        shell: bash
        run: |
          set -euo pipefail

          forbidden_legacy='org\.bukkit\.ChatColor|net\.md_5\.bungee\.api\.ChatColor|net\.minecraft\.server\.v[0-9_]+|org\.bukkit\.craftbukkit'
          if grep -RInE --include='*.java' "$forbidden_legacy" src/main/java; then
            echo 'Forbidden legacy API usage detected.'
            exit 1
          fi

          if grep -RInE --include='*.java' 'static[[:space:]]+(final[[:space:]]+)?[^;]*(Player|Entity|World)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*[;=]' src/main/java; then
            echo 'Static live Bukkit reference detected.'
            exit 1
          fi

          echo 'Source API boundary validation passed.'

      - name: Verify plugin artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact='build/libs/PixelProtect.jar'
          test -f "$artifact"
          jar tf "$artifact" | grep -q '^paper-plugin.yml$'
          jar tf "$artifact" | grep -q '^de/pixelprotect/'

          if unzip -p "$artifact" paper-plugin.yml | grep -Eq '^(commands:|.*[[:space:]]commands:)'; then
            echo 'Legacy paper-plugin.yml command declaration detected.'
            exit 1
          fi

          if jar tf "$artifact" | grep -qE '^net/minecraft/server/v[0-9_]+/'; then
            echo 'Legacy versioned NMS package detected in artifact.'
            exit 1
          fi

          echo 'PixelProtect artifact validation passed.'

      - name: Paper 26.2 startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-server/plugins
          cp build/libs/PixelProtect.jar integration-server/plugins/PixelProtect.jar
          printf 'eula=true\n' > integration-server/eula.txt
          curl --fail --silent --show-error --location \
            'https://api.papermc.io/v2/projects/paper/versions/26.2/builds/121/downloads/paper-26.2-121.jar' \
            --output integration-server/paper.jar
          (cd integration-server && java -Xms512M -Xmx1G -jar paper.jar --nogui > server.log 2>&1 & echo $! > server.pid)
          for i in $(seq 1 90); do
            if grep -q 'Done (' integration-server/server.log 2>/dev/null; then break; fi
            if grep -q 'Failed to load' integration-server/server.log 2>/dev/null; then cat integration-server/server.log; exit 1; fi
            sleep 2
          done
          grep -q 'Done (' integration-server/server.log
          grep -q 'PixelProtect enabled' integration-server/server.log
          kill "$(cat integration-server/server.pid)" || true
          sleep 2
          tail -n 200 integration-server/server.log

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PixelProtect
          path: build/libs/PixelProtect.jar
