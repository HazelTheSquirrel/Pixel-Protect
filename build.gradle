plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'de.pixelprotect'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { name = 'papermc'; url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    paperweight.paperDevBundle('26.2.build.121-stable')
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.zaxxer:HikariCP:7.0.2'
    implementation 'com.mysql:mysql-connector-j:9.7.0'
}

paperweight {
    reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getMOJANG_PRODUCTION()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
    options.compilerArgs.addAll(['-Xlint:all'])
}

tasks.shadowJar {
    archiveFileName = 'PixelProtect.jar'
    relocate 'com.google.gson', 'de.pixelprotect.libs.gson'
    relocate 'com.zaxxer.hikari', 'de.pixelprotect.libs.hikari'
    relocate 'com.mysql', 'de.pixelprotect.libs.mysql'
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.build { dependsOn tasks.shadowJar }
