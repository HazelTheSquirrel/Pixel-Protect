name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build PixelProtect
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify source API boundaries
        shell: bash
        run: |
          set -euo pipefail

          forbidden_legacy='org\.bukkit\.ChatColor|net\.md_5\.bungee\.api\.ChatColor|net\.minecraft\.server\.v[0-9_]+|org\.bukkit\.craftbukkit'
          if grep -RInE --include='*.java' "$forbidden_legacy" src/main/java; then
            echo 'Forbidden legacy API usage detected.'
            exit 1
          fi

          if grep -RInE --include='*.java' 'static[[:space:]]+(final[[:space:]]+)?[^;]*(Player|Entity|World)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*[;=]' src/main/java; then
            echo 'Static live Bukkit reference detected.'
            exit 1
          fi

          echo 'Source API boundary validation passed.'

      - name: Verify plugin artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact='build/libs/PixelProtect.jar'
          test -f "$artifact"
          jar tf "$artifact" | grep -q '^paper-plugin.yml$'
          jar tf "$artifact" | grep -q '^de/pixelprotect/'

          if unzip -p "$artifact" paper-plugin.yml | grep -Eq '^(commands:|.*[[:space:]]commands:)'; then
            echo 'Legacy paper-plugin.yml command declaration detected.'
            exit 1
          fi

          if jar tf "$artifact" | grep -qE '^net/minecraft/server/v[0-9_]+/'; then
            echo 'Legacy versioned NMS package detected in artifact.'
            exit 1
          fi

          if jar tf "$artifact" | grep -qE '^com/google/gson/|^com/zaxxer/hikari/|^com/mysql/'; then
            echo 'Unrelocated third-party runtime classes detected in artifact.'
            exit 1
          fi

          if ! jar tf "$artifact" | grep -q '^de/pixelprotect/libs/gson/'; then
            echo 'Relocated Gson package missing from shaded artifact.'
            exit 1
          fi
          if ! jar tf "$artifact" | grep -q '^de/pixelprotect/libs/hikari/'; then
            echo 'Relocated Hikari package missing from shaded artifact.'
            exit 1
          fi
          if ! jar tf "$artifact" | grep -q '^de/pixelprotect/libs/mysql/'; then
            echo 'Relocated MySQL package missing from shaded artifact.'
            exit 1
          fi

          if ! jar tf "$artifact" | grep -q '^META-INF/services/java.sql.Driver$'; then
            echo 'Shaded JDBC service descriptor missing.'
            exit 1
          fi

          echo 'PixelProtect artifact validation passed.'

      - name: Paper 26.2 startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-server/plugins
          cp build/libs/PixelProtect.jar integration-server/plugins/PixelProtect.jar
          printf 'eula=true\n' > integration-server/eula.txt

          paper_user_agent='PixelProtect-CI/1.0.0 (https://github.com/HazelTheSquirrel/Pixel-Protect)'
          builds_json="$(curl --fail --silent --show-error --location \
            --header "User-Agent: ${paper_user_agent}" \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds')"

          paper_url="$(printf '%s' "$builds_json" | jq -er \
            'first(.[] | select(.id == 121 and .channel == "STABLE") | .downloads["server:default"].url)')"

          test -n "$paper_url"
          curl --fail --silent --show-error --location \
            --header "User-Agent: ${paper_user_agent}" \
            "$paper_url" \
            --output integration-server/paper.jar

          server_pid=''
          cleanup() {
            if [[ -n "$server_pid" ]] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              for _ in $(seq 1 10); do
                if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
                sleep 1
              done
              kill -9 "$server_pid" 2>/dev/null || true
            fi
            echo '--- Paper server log (last 300 lines) ---'
            tail -n 300 integration-server/server.log 2>/dev/null || true
          }
          trap cleanup EXIT

          cd integration-server
          java -Xms512M -Xmx1G -jar paper.jar --nogui > server.log 2>&1 &
          server_pid=$!

          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log 2>/dev/null; then
              break
            fi
            if grep -Eq 'Failed to load|Could not load|Exception in thread|ERROR.*PixelProtect|SEVERE.*PixelProtect' server.log 2>/dev/null; then
              echo 'Paper reported a startup failure:'
              cat server.log
              exit 1
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Paper terminated before startup completed.'
              cat server.log
              exit 1
            fi
            sleep 2
          done

          if ! grep -q 'Done (' server.log; then
            echo 'Paper did not reach the ready state within 240 seconds.'
            cat server.log
            exit 1
          fi

          grep -q 'PixelProtect wurde mit Speicher-Backend' server.log
          echo 'Paper 26.2 startup smoke test passed.'

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PixelProtect
          path: build/libs/PixelProtect.jar
