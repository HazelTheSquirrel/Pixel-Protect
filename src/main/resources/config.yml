storage:
  backend: sqlite
  file: pixelprotect.db
  queue-capacity: 10000
  batch-size: 256
  flush-interval-millis: 250
  overflow-spool: true
  mysql:
    jdbc-url: jdbc:mysql://127.0.0.1:3306/pixelprotect
    username: pixelprotect
    password: change-me
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-millis: 5000
    leak-detection-millis: 0

worlds:
  include: []
  exclude: []

retention:
  enabled: true
  days: 30
  maintenance-interval-ticks: 24000

logging:
  block-place-break: true
  explosions: true
  fire: true
  piston: true
  fluids: true
  growth: true
  entity-block-changes: true
  entities: true
  inventories: true
  block-entities: true

rollback:
  max-hours: 168
  max-radius: 128
  max-records: 100000
  page-size: 50
  max-concurrent-jobs: 1

diagnostics:
  enabled: true
  log-interval-minutes: 5
