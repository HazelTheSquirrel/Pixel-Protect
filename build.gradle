plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'de.pixelprotect'
version = '0.1.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    paperweight.paperDevBundle('26.2.build.121-stable')
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.zaxxer:HikariCP:7.0.2'
    implementation 'com.mysql:mysql-connector-j:9.7.0'
}

paperweight {
    reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getMOJANG_PRODUCTION()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
    options.compilerArgs.addAll(['-Xlint:all'])
}

tasks.shadowJar {
    archiveFileName = 'PixelProtect.jar'
    relocate 'org.sqlite', 'de.pixelprotect.libs.sqlite'
    relocate 'com.sun.jna', 'de.pixelprotect.libs.jna'
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.build {
    dependsOn tasks.shadowJar
}
