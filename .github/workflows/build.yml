name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Verify plugin artifact
        shell: bash
        run: |
          test -f build/libs/PixelProtect.jar
          unzip -p build/libs/PixelProtect.jar paper-plugin.yml | grep -q '^name: PixelProtect$'
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PixelProtect
          path: build/libs/PixelProtect.jar
