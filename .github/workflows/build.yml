name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build PixelProtect
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify source API boundaries and project independence
        shell: bash
        run: |
          set -euo pipefail

          forbidden_legacy='org\\.bukkit\\.ChatColor|net\\.md_5\\.bungee\\.api\\.ChatColor|net\\.minecraft\\.server\\.v[0-9_]+|org\\.bukkit\\.craftbukkit'
          if grep -RInE --include='*.java' "$forbidden_legacy" src/main/java; then
            echo 'Forbidden legacy API usage detected.'
            exit 1
          fi

          if grep -RInE --include='*.java' 'static[[:space:]]+(final[[:space:]]+)?[^;]*(Player|Entity|World)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*[;=]' src/main/java; then
            echo 'Static live Bukkit reference detected.'
            exit 1
          fi

          if grep -RIniE 'coreprotect|playpro|parity' README.md docs src; then
            echo 'Third-party parity/source-reference material detected in project sources or documentation.'
            exit 1
          fi

          if find src -type f -name 'plugin.yml' -print -quit | grep -q .; then
            echo 'Legacy plugin.yml detected; PixelProtect must use paper-plugin.yml only.'
            exit 1
          fi

          echo 'Source API boundary and project-independence validation passed.'

      - name: Verify plugin artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact='build/libs/PixelProtect.jar'
          test -f "$artifact"
          jar tf "$artifact" | grep -q '^paper-plugin.yml$'
          jar tf "$artifact" | grep -q '^de/pixelprotect/'

          if jar tf "$artifact" | grep -q '^plugin.yml$'; then
            echo 'Legacy plugin.yml found in artifact.'
            exit 1
          fi

          if unzip -p "$artifact" paper-plugin.yml | grep -Eq '^(commands:|.*[[:space:]]commands:)'; then
            echo 'Legacy paper-plugin.yml command declaration detected.'
            exit 1
          fi

          if jar tf "$artifact" | grep -qE '^net/minecraft/server/v[0-9_]+/'; then
            echo 'Legacy versioned NMS package detected in artifact.'
            exit 1
          fi

          if jar tf "$artifact" | grep -qE '^com/google/gson/|^com/zaxxer/hikari/|^com/mysql/'; then
            echo 'Unrelocated third-party runtime classes detected in artifact.'
            exit 1
          fi

          if ! jar tf "$artifact" | grep -q '^de/pixelprotect/libs/gson/'; then
            echo 'Relocated Gson package missing from shaded artifact.'
            exit 1
          fi
          if ! jar tf "$artifact" | grep -q '^de/pixelprotect/libs/hikari/'; then
            echo 'Relocated Hikari package missing from shaded artifact.'
            exit 1
          fi
          if ! jar tf "$artifact" | grep -q '^de/pixelprotect/libs/mysql/'; then
            echo 'Relocated MySQL package missing from shaded artifact.'
            exit 1
          fi

          if ! jar tf "$artifact" | grep -q '^META-INF/services/java.sql.Driver$'; then
            echo 'Shaded JDBC service descriptor missing.'
            exit 1
          fi

          echo 'PixelProtect artifact validation passed.'

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PixelProtect
          path: build/libs/PixelProtect.jar
